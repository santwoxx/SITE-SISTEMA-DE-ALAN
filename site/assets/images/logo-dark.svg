<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" fill="none">
  <defs>
    <linearGradient id="yellowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD000" />
      <stop offset="100%" stop-color="#FF9D00" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#FFB800" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- House / Roof Icon -->
  <g transform="translate(10, 6)">
    <!-- Roof outline -->
    <path d="M 32 6 L 60 30 L 52 30 L 32 14 L 12 30 L 4 30 Z" fill="url(#yellowGrad)" filter="url(#glow)"/>
    <!-- Chimney / upper block -->
    <rect x="42" y="10" width="7" height="12" fill="url(#yellowGrad)"/>
    <!-- Window / Core -->
    <rect x="23" y="24" width="8" height="10" rx="1" fill="url(#yellowGrad)"/>
    <rect x="33" y="24" width="8" height="10" rx="1" fill="url(#yellowGrad)"/>
    <!-- Foundation line -->
    <rect x="16" y="38" width="32" height="3" rx="1.5" fill="url(#yellowGrad)"/>
  </g>

  <!-- Brand Typography -->
  <text x="82" y="44" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-weight="900" font-size="34" fill="#0B0C10" letter-spacing="1">
    MONTA<tspan fill="#FFB800">XX</tspan>
  </text>

  <!-- Slogan / Subtitle -->
  <text x="83" y="62" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-weight="500" font-size="9" fill="#64748B" letter-spacing="1.2">
    MONTAGENS E SERVIÇOS DE MANUTENÇÃO
  </text>
</svg>
